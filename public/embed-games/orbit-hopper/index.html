<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Hopper</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 34%),
          linear-gradient(180deg, #081120 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(100%, 920px);
        padding: 18px;
      }

      .card {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.55);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(125, 211, 252, 0.75);
        margin-bottom: 8px;
      }

      .title {
        font-size: 26px;
        font-weight: 800;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .pill,
      button {
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: #f8fafc;
        padding: 10px 16px;
        font-size: 14px;
      }

      button {
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: rgba(34, 211, 238, 0.18);
      }

      .game {
        padding: 20px;
      }

      canvas {
        width: 100%;
        display: block;
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(14, 116, 144, 0.2), rgba(2, 6, 23, 0.1)),
          #020617;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 0 20px 20px;
      }

      .hint {
        font-size: 14px;
        line-height: 1.7;
        color: #94a3b8;
        max-width: 560px;
      }

      .touch {
        display: flex;
        gap: 10px;
      }

      @media (max-width: 720px) {
        .topbar,
        .controls {
          padding-left: 14px;
          padding-right: 14px;
        }

        .game {
          padding: 14px;
        }

        .touch {
          width: 100%;
        }

        .touch button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="topbar">
          <div>
            <div class="eyebrow">Embedded HTML5 game</div>
            <div class="title">Orbit Hopper</div>
          </div>
          <div class="stats">
            <div class="pill" id="score">Score: 0</div>
            <div class="pill" id="lives">Lives: 3</div>
            <button id="startButton" type="button">Start Game</button>
          </div>
        </div>
        <div class="game">
          <canvas id="game" width="880" height="560" aria-label="Orbit Hopper game board"></canvas>
        </div>
        <div class="controls">
          <div class="hint">
            Use the arrow keys or the lane buttons to move. Blue rings add score.
            Red debris costs a life. The pace ramps up automatically, so each run
            still feels worth one more try.
          </div>
          <div class="touch">
            <button id="leftButton" type="button">Move Left</button>
            <button id="rightButton" type="button">Move Right</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game");
      const context = canvas.getContext("2d");
      const scoreLabel = document.getElementById("score");
      const livesLabel = document.getElementById("lives");
      const startButton = document.getElementById("startButton");
      const leftButton = document.getElementById("leftButton");
      const rightButton = document.getElementById("rightButton");

      const lanePositions = [220, 440, 660];
      const player = { lane: 1, size: 34, y: 485 };
      let items = [];
      let score = 0;
      let lives = 3;
      let running = false;
      let speed = 3.2;
      let spawnTick = 0;
      let animationFrame = 0;

      function resetGame() {
        items = [];
        score = 0;
        lives = 3;
        speed = 3.2;
        spawnTick = 0;
        player.lane = 1;
        running = true;
        startButton.textContent = "Restart Run";
        syncHud();
      }

      function syncHud() {
        scoreLabel.textContent = `Score: ${score}`;
        livesLabel.textContent = `Lives: ${lives}`;
      }

      function moveLane(direction) {
        player.lane = Math.max(0, Math.min(2, player.lane + direction));
      }

      function spawnItem() {
        const lane = Math.floor(Math.random() * 3);
        const collectible = Math.random() > 0.55;
        items.push({
          lane,
          y: -24,
          size: collectible ? 16 : 22,
          collectible,
        });
      }

      function step() {
        if (running) {
          spawnTick += 1;
          if (spawnTick > 28) {
            spawnItem();
            spawnTick = 0;
          }

          speed += 0.0008;
          items.forEach((item) => {
            item.y += speed;
          });

          items = items.filter((item) => {
            const playerX = lanePositions[player.lane];
            const dx = Math.abs(playerX - lanePositions[item.lane]);
            const dy = Math.abs(player.y - item.y);

            if (dx < 20 && dy < 28) {
              if (item.collectible) {
                score += 10;
              } else {
                lives -= 1;
              }
              syncHud();
              return false;
            }

            if (item.y > canvas.height + 40) {
              if (item.collectible) {
                score += 1;
                syncHud();
              }
              return false;
            }

            return true;
          });

          if (lives <= 0) {
            running = false;
            startButton.textContent = "Play Again";
          }
        }

        render();
        animationFrame = requestAnimationFrame(step);
      }

      function renderBackground() {
        context.clearRect(0, 0, canvas.width, canvas.height);

        const gradient = context.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#082f49");
        gradient.addColorStop(1, "#020617");
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);

        lanePositions.forEach((x, index) => {
          context.strokeStyle = index === player.lane ? "rgba(34,211,238,0.55)" : "rgba(255,255,255,0.08)";
          context.lineWidth = 4;
          context.beginPath();
          context.moveTo(x, 50);
          context.lineTo(x, canvas.height - 60);
          context.stroke();
        });
      }

      function renderPlayer() {
        const x = lanePositions[player.lane];
        context.fillStyle = "#67e8f9";
        context.beginPath();
        context.roundRect(x - 26, player.y - 24, 52, 52, 18);
        context.fill();
        context.fillStyle = "#082f49";
        context.beginPath();
        context.arc(x, player.y + 1, 9, 0, Math.PI * 2);
        context.fill();
      }

      function renderItems() {
        items.forEach((item) => {
          const x = lanePositions[item.lane];
          if (item.collectible) {
            context.fillStyle = "#93c5fd";
            context.beginPath();
            context.arc(x, item.y, item.size, 0, Math.PI * 2);
            context.fill();
            context.strokeStyle = "#dbeafe";
            context.lineWidth = 4;
            context.stroke();
          } else {
            context.fillStyle = "#fb7185";
            context.beginPath();
            context.roundRect(x - 22, item.y - 22, 44, 44, 12);
            context.fill();
          }
        });
      }

      function renderOverlay() {
        if (running) return;

        context.fillStyle = "rgba(2,6,23,0.6)";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = "#f8fafc";
        context.textAlign = "center";
        context.font = "800 34px Inter, Arial, sans-serif";
        context.fillText(score === 0 ? "Ready to hop?" : "Run over", canvas.width / 2, 230);
        context.font = "500 20px Inter, Arial, sans-serif";
        context.fillStyle = "#cbd5e1";
        context.fillText(
          score === 0
            ? "Catch blue rings and dodge red debris."
            : `Final score: ${score}. Hit Start Game for another run.`,
          canvas.width / 2,
          275,
        );
      }

      function render() {
        renderBackground();
        renderItems();
        renderPlayer();
        renderOverlay();
      }

      startButton.addEventListener("click", resetGame);
      leftButton.addEventListener("click", () => moveLane(-1));
      rightButton.addEventListener("click", () => moveLane(1));

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") moveLane(-1);
        if (event.key === "ArrowRight") moveLane(1);
        if (event.key === " " && !running) {
          event.preventDefault();
          resetGame();
        }
      });

      syncHud();
      render();
      animationFrame = requestAnimationFrame(step);

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(animationFrame);
      });
    </script>
  </body>
</html>
