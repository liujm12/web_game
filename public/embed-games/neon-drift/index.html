<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Drift</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        color: #eef2ff;
        background:
          radial-gradient(circle at top, rgba(192, 132, 252, 0.25), transparent 34%),
          linear-gradient(180deg, #09090b 0%, #111827 45%, #030712 100%);
      }
      .shell { width: min(100%, 920px); height: 100vh; padding: 12px; }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        border-radius: 28px;
        overflow: hidden;
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 30px 80px rgba(3,7,18,0.55);
      }
      .topbar, .footer {
        display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
        padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .footer { border-bottom: 0; border-top: 1px solid rgba(255,255,255,0.08); }
      .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: rgba(196,181,253,0.72); }
      .title { margin-top: 6px; font-size: 24px; font-weight: 800; }
      .statrow, .touch { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .pill, button {
        border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.06); color: #f8fafc;
        padding: 10px 16px; font-size: 14px;
      }
      button { cursor: pointer; font-weight: 700; }
      button:hover { background: rgba(168,85,247,0.18); }
      .game { flex: 1; min-height: 0; padding: 12px 18px; }
      canvas { width: 100%; height: 100%; display: block; border-radius: 24px; background: #020617; }
      .hint { max-width: 560px; font-size: 13px; line-height: 1.45; color: #a5b4fc; }
      @media (max-width: 720px) { .touch { width: 100%; } .touch button { flex: 1; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="topbar">
          <div>
            <div class="eyebrow">Embedded arcade game</div>
            <div class="title">Neon Drift</div>
          </div>
          <div class="statrow">
            <div class="pill" id="score">Score: 0</div>
            <div class="pill" id="lives">Lives: 3</div>
            <button id="startButton" type="button">Start Run</button>
          </div>
        </div>
        <div class="game">
          <canvas id="game" width="880" height="560" aria-label="Neon Drift board"></canvas>
        </div>
        <div class="footer">
          <div class="hint">Move between three lanes, collect blue cells, and avoid the blackout blocks. Built to prove how quickly an embedded game can be added to the catalog.</div>
          <div class="touch">
            <button id="leftButton" type="button">Move Left</button>
            <button id="rightButton" type="button">Move Right</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.getElementById("score");
      const livesLabel = document.getElementById("lives");
      const startButton = document.getElementById("startButton");
      const lanes = [220, 440, 660];
      const ship = { lane: 1, y: 480 };
      let score = 0, lives = 3, speed = 3.6, running = false, spawnTick = 0, items = [];

      function syncHud() {
        scoreLabel.textContent = `Score: ${score}`;
        livesLabel.textContent = `Lives: ${lives}`;
      }
      function resetGame() {
        score = 0; lives = 3; speed = 3.6; running = true; spawnTick = 0; items = []; ship.lane = 1;
        startButton.textContent = "Restart Run";
        syncHud();
      }
      function move(delta) { ship.lane = Math.max(0, Math.min(2, ship.lane + delta)); }
      function spawn() {
        items.push({ lane: Math.floor(Math.random() * 3), y: -30, good: Math.random() > 0.5 });
      }
      function update() {
        if (running) {
          spawnTick += 1;
          if (spawnTick > 24) { spawn(); spawnTick = 0; }
          speed += 0.0009;
          items.forEach((item) => item.y += speed);
          items = items.filter((item) => {
            const hit = item.lane === ship.lane && Math.abs(item.y - ship.y) < 34;
            if (hit) {
              if (item.good) score += 12; else lives -= 1;
              syncHud();
              return false;
            }
            return item.y < canvas.height + 40;
          });
          if (lives <= 0) { running = false; startButton.textContent = "Play Again"; }
        }
      }
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const bg = ctx.createLinearGradient(0,0,0,canvas.height);
        bg.addColorStop(0, "#1e1b4b"); bg.addColorStop(1, "#020617");
        ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height);
        lanes.forEach((x, i) => {
          ctx.strokeStyle = i === ship.lane ? "rgba(168,85,247,0.65)" : "rgba(255,255,255,0.1)";
          ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, 500); ctx.stroke();
        });
        items.forEach((item) => {
          const x = lanes[item.lane];
          ctx.fillStyle = item.good ? "#38bdf8" : "#fb7185";
          ctx.beginPath(); ctx.roundRect(x - 24, item.y - 24, 48, 48, 14); ctx.fill();
        });
        const shipX = lanes[ship.lane];
        ctx.fillStyle = "#e879f9"; ctx.beginPath(); ctx.roundRect(shipX - 28, ship.y - 24, 56, 56, 18); ctx.fill();
        ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(shipX, ship.y + 2, 11, 0, Math.PI * 2); ctx.fill();
        if (!running) {
          ctx.fillStyle = "rgba(2,6,23,0.58)"; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = "#f8fafc"; ctx.textAlign = "center"; ctx.font = "800 34px Inter, Arial, sans-serif";
          ctx.fillText(score === 0 ? "Ready to drift?" : "Run over", canvas.width/2, 230);
          ctx.font = "500 20px Inter, Arial, sans-serif"; ctx.fillStyle = "#c4b5fd";
          ctx.fillText(score === 0 ? "Collect blue cells and dodge blackout blocks." : `Final score: ${score}`, canvas.width/2, 275);
        }
      }
      function loop() { update(); draw(); requestAnimationFrame(loop); }
      startButton.addEventListener("click", resetGame);
      document.getElementById("leftButton").addEventListener("click", () => move(-1));
      document.getElementById("rightButton").addEventListener("click", () => move(1));
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
        if (event.key === " " && !running) { event.preventDefault(); resetGame(); }
      });
      syncHud(); draw(); loop();
    </script>
  </body>
</html>
